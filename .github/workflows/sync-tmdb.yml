name: Sync new TMDB releases

on:
  # The nightly schedule is off: TMDB imports have no download links. Run it by hand if needed.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm sync:tmdb
        env:
          TMDB_ACCESS_TOKEN: ${{ secrets.TMDB_ACCESS_TOKEN }}
          TMDB_MAX_PER_CATEGORY: 12
      - run: pnpm exec tsc --noEmit
      - name: Commit updated catalog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/tmdb-generated.ts data/tmdb-catalog.json
          git diff --cached --quiet || git commit -m "chore: sync new TMDB releases"
          git push
